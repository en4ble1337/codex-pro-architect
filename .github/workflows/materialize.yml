name: Materialize Public Alpha

on:
  push:
    branches: [launchpad-bootstrap]
    paths:
      - "bootstrap/**"
      - ".github/workflows/materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launchpad-bootstrap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate reviewed source tree
        run: python3 bootstrap/materialize.py
      - name: Install locked package state
        run: npm ci
      - name: Verify Launchpad and source contracts
        run: |
          python3 setup_launchpad.py --check
          python3 execution/verify_setup.py
      - name: Run syntax and tests
        run: npm run ci
      - name: Clean packed-package smoke
        run: npm run smoke:package
      - name: Inspect package and dependency surface
        run: |
          npm run pack:dry
          npm audit --omit=dev
          npm ls --omit=dev
      - name: Commit materialized public alpha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: publish Launchpad-governed Pro Architect alpha" -m "Refs: directive-003"
          git push origin HEAD:launchpad-bootstrap
