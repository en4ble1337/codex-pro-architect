name: Apply Installer Fixup

on:
  push:
    branches: [launchpad-bootstrap]
    paths:
      - "bootstrap/fixup_install.py"
      - ".github/workflows/fixup-install.yml"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launchpad-bootstrap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python3 bootstrap/fixup_install.py
      - run: npm ci
      - run: python3 execution/verify_setup.py
      - run: npm run ci
      - run: npm run smoke:package
      - run: npm run pack:dry
      - run: npm audit --omit=dev
      - name: Commit verified fixup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(install): harden managed Codex config markers" -m "Refs: directive-003"
          git push origin HEAD:launchpad-bootstrap
