name: Publish security hardening review branch

on:
  push:
    branches:
      - bootstrap/security-hardening
    paths:
      - .github/workflows/publish-security-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch bootstrap
        uses: actions/checkout@v4

      - name: Restore and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/hardening.part00a \
              bootstrap/hardening.part00b \
              bootstrap/hardening.part01 \
              bootstrap/hardening.part02 \
              bootstrap/hardening.part03 \
              > /tmp/hardening.patch.gz.b64
          base64 --decode /tmp/hardening.patch.gz.b64 > /tmp/hardening.patch.gz
          gunzip -c /tmp/hardening.patch.gz > /tmp/hardening.patch
          echo "b91244abea5530f0242bb664efc1aa3b82fc4466faa0d89791b453c13cd8e517  /tmp/hardening.patch" \
            | sha256sum --check --strict

      - name: Apply and validate hardening
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --detach origin/main
          git switch -c review/security-hardening
          git apply --check /tmp/hardening.patch
          git apply /tmp/hardening.patch
          npm ci
          npm run ci
          npm run pack:dry
          npm audit --omit=dev

      - name: Publish clean review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Bart"
          git config user.email "167246435+en4ble1337@users.noreply.github.com"
          git add --all
          git commit -m "security: harden repository inspection and MCP boundaries"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            push --force \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            review/security-hardening:review/security-hardening
