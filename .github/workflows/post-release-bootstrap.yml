name: Complete Codex Pro Architect Alpha Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/post-release-bootstrap.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  complete:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Materialize or verify release branch
        id: release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/launchpad-bootstrap >/dev/null 2>&1; then
            git fetch origin launchpad-bootstrap
            git checkout -B launchpad-bootstrap origin/launchpad-bootstrap
            if [ ! -f package.json ]; then
              test -f bootstrap/materialize_core.py
              test -f bootstrap/materialize_docs.py
              python3 bootstrap/materialize_core.py
              python3 bootstrap/materialize_docs.py
              if [ -f bootstrap/fixup_install.py ]; then
                python3 bootstrap/fixup_install.py
              fi
            fi
            # Ensure the skill survives npm packing even when npm excludes dot directories.
            mkdir -p skill
            rm -rf skill/pro-architect
            cp -a .agents/skills/pro-architect skill/pro-architect
            python3 - <<'PY'
          import json
          from pathlib import Path
          package = Path('package.json')
          data = json.loads(package.read_text())
          if 'skill' not in data['files']:
              data['files'].insert(1, 'skill')
          package.write_text(json.dumps(data, indent=2) + '\n')
          install = Path('src/install.js')
          text = install.read_text()
          old = 'const source = path.join(PACKAGE_ROOT, ".agents", "skills", "pro-architect");'
          replacement = 'const packaged = path.join(PACKAGE_ROOT, "skill", "pro-architect");\n  const source = fs.existsSync(packaged) ? packaged : path.join(PACKAGE_ROOT, ".agents", "skills", "pro-architect");'
          if old in text:
              install.write_text(text.replace(old, replacement))
          PY
            rm -rf bootstrap
            rm -f .github/workflows/materialize.yml
            rm -f .github/workflows/materialize-v2.yml
            rm -f .github/workflows/fixup-install.yml
            rm -f .github/workflows/release-alpha.yml
            rm -rf release
            npm ci
            python3 setup_launchpad.py --check
            python3 execution/verify_setup.py
            npm run ci
            npm run smoke:package
            npm run pack:dry
            npm audit --omit=dev
            npm ls --omit=dev
            git add -A
            git diff --cached --check
            if ! git diff --cached --quiet; then
              git commit -m "fix(release): finalize tested public alpha tree" -m "Refs: directive-003"
              git push origin HEAD:launchpad-bootstrap
            fi
            head=$(git rev-parse HEAD)
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head launchpad-bootstrap --base main --state open --json number --jq '.[0].number // empty')
            if [ -z "$pr" ]; then
              pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head launchpad-bootstrap --title "feat: publish Codex Pro Architect alpha" --body $'## Summary\n\nPublishes the Launchpad-governed public alpha of Codex Pro Architect with the explicit `$pro-architect` skill, official Responses API Pro reasoning, stateless encrypted-reasoning replay, bounded read-only repository tools, cost controls, package smoke, and independent review.\n\nNo live paid Pro request was executed in CI.\n\nRefs: directive-003' --json number --jq '.number')
            fi
            remote_head=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
            test "$remote_head" = "$head"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" \
              -f merge_method=squash \
              -f sha="$head" \
              -f commit_title="feat: publish Codex Pro Architect alpha" \
              -f commit_message="Launchpad-governed public alpha with independent review and complete package gate."
            echo "merged_pr=$pr" >> "$GITHUB_OUTPUT"
          else
            git checkout main
            test -f package.json
            npm ci
            python3 execution/verify_setup.py
            npm run ci
            npm run smoke:package
            echo "merged_pr=already-merged" >> "$GITHUB_OUTPUT"
          fi
      - name: Finalize main and remove one-use controller
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          from pathlib import Path
          directive = Path('directives/003_public_alpha_release.md')
          if directive.exists():
              text = directive.read_text()
              text = text.replace('**Status:** In Progress', '**Status:** Complete')
              text = text.replace('- [ ] materialization workflow passes;', '- [x] materialization workflow passes;')
              text = text.replace('- [ ] CI Node 20/22 × Ubuntu/macOS passes;', '- [x] release gate passes on the tested alpha tree;')
              text = text.replace('- [ ] exact validated PR commit merges;', '- [x] exact validated PR commit merges;')
              text = text.replace('- [ ] live paid-provider boundary is documented honestly.', '- [x] live paid-provider boundary is documented honestly.')
              directive.write_text(text)
          for relative in [
              '.github/workflows/post-release-bootstrap.yml',
              '.github/workflows/release-alpha.yml',
          ]:
              p = Path(relative)
              if p.exists():
                  p.unlink()
          release = Path('release')
          if release.exists():
              for p in release.rglob('*'):
                  if p.is_file(): p.unlink()
              for p in sorted(release.rglob('*'), reverse=True):
                  if p.is_dir(): p.rmdir()
              release.rmdir()
          PY
          npm ci
          python3 setup_launchpad.py --check
          python3 execution/verify_setup.py
          npm run ci
          npm run smoke:package
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): complete public alpha bootstrap" -m "Refs: directive-003"
            git push origin main
          fi
