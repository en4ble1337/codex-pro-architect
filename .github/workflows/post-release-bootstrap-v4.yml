name: Complete Codex Pro Architect Alpha Bootstrap V4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/post-release-bootstrap-v4.yml"

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      pull_request: ${{ steps.meta.outputs.pull_request }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp .github/finalize_alpha.py /tmp/finalize_alpha.py
          cp .github/fix_mcp_cancellation.py /tmp/fix_mcp_cancellation.py
          cp .github/normalize_review_v4.py /tmp/normalize_review_v4.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          if git cat-file -e origin/main:package.json 2>/dev/null; then
            git checkout -B alpha-release-v4 origin/main
          else
            git ls-remote --exit-code origin refs/heads/launchpad-bootstrap >/dev/null
            git fetch origin launchpad-bootstrap
            git checkout -B alpha-release-v4 origin/launchpad-bootstrap
          fi

          if [ ! -f package.json ]; then
            test -f bootstrap/materialize_core.py
            test -f bootstrap/materialize_docs.py
            python3 bootstrap/materialize_core.py
            python3 bootstrap/materialize_docs.py
          fi

          python3 /tmp/finalize_alpha.py prepare --root .
          python3 /tmp/fix_mcp_cancellation.py
          python3 /tmp/normalize_review_v4.py
          rm -f docs/BOOTSTRAP-STATUS.md

          npm ci
          python3 setup_launchpad.py --check
          python3 execution/verify_setup.py
          node --test tests/mcp-cancellation.test.js
          npm run ci
          npm run smoke:package
          npm run pack:dry
          npm audit --omit=dev
          npm ls --omit=dev

          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix(mcp): finalize concurrent cancellation release" -m "Refs: directive-004"
          fi
          git push --force-with-lease origin HEAD:alpha-release-v4
          source_sha=$(git rev-parse HEAD)

          pull_request=$(gh pr list --repo "$GITHUB_REPOSITORY" --head alpha-release-v4 --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pull_request" ]; then
            set +e
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head alpha-release-v4 \
              --title "feat: publish Codex Pro Architect alpha" \
              --body $'## Summary\n\nPublishes the Launchpad-governed public alpha of Codex Pro Architect.\n\n- explicit `$pro-architect` skill\n- official Responses API / GPT-5.6 Pro specialist\n- stateless encrypted-reasoning replay\n- bounded read-only repository tools\n- functional in-flight MCP cancellation\n- cost accounting and guardrails\n- clean packed-install and MCP smoke\n- independent adversarial review\n\nNo live paid Pro request was executed in CI.\n\nRefs: directives 003-004'
            create_status=$?
            set -e
            if [ "$create_status" -eq 0 ]; then
              pull_request=$(gh pr list --repo "$GITHUB_REPOSITORY" --head alpha-release-v4 --base main --state open --json number --jq '.[0].number // empty')
            else
              pull_request=direct-merge
            fi
          fi

          if [ "$pull_request" != "direct-merge" ]; then
            remote_head=$(gh pr view "$pull_request" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
            test "$remote_head" = "$source_sha"
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "pull_request=$pull_request" >> "$GITHUB_OUTPUT"

  matrix:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: python3 setup_launchpad.py --check
      - run: python3 execution/verify_setup.py
      - run: node --test tests/mcp-cancellation.test.js
      - run: npm run ci
      - run: npm run smoke:package
      - run: npm run pack:dry
      - run: npm audit --omit=dev
      - run: npm ls --omit=dev

  merge:
    needs: [prepare, matrix]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enforce independent-review gate
        run: |
          review=$(gh api "repos/$GITHUB_REPOSITORY/contents/docs/SECOND-AGENT-REVIEW.md?ref=${{ needs.prepare.outputs.source_sha }}" --jq '.content' | base64 -d)
          REVIEW="$review" python3 -c 'import os,re; text=os.environ["REVIEW"]; sections=["Critical Findings","Important Findings"]; matches=[(title,re.search(rf"^## {re.escape(title)}\s*\n(.*?)(?=^## |\Z)",text,re.M|re.S)) for title in sections]; bad=[(title,None if match is None else match.group(1).strip()) for title,match in matches if match is None or match.group(1).strip() not in {"None.","None","- None."}]; (_ for _ in ()).throw(SystemExit(f"unresolved review gate: {bad}")) if bad else None'
      - name: Merge exact tested source
        run: |
          set -euo pipefail
          source_sha="${{ needs.prepare.outputs.source_sha }}"
          pr="${{ needs.prepare.outputs.pull_request }}"
          if [ "$pr" = "direct-merge" ]; then
            response=$(gh api --method POST "repos/$GITHUB_REPOSITORY/merges" \
              -f base=main \
              -f head="$source_sha" \
              -f commit_message="Launchpad-governed Codex Pro Architect alpha; exact source SHA passed the complete release matrix.")
            test -n "$(printf '%s' "$response" | jq -r '.sha')"
          else
            head=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
            test "$head" = "$source_sha"
            response=$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" \
              -f merge_method=squash \
              -f sha="$source_sha" \
              -f commit_title="feat: publish Codex Pro Architect alpha" \
              -f commit_message="Launchpad-governed public alpha with independent review, encrypted reasoning replay, and in-flight MCP cancellation.")
            test "$(printf '%s' "$response" | jq -r '.merged')" = "true"
          fi

  finalize:
    needs: [prepare, matrix, merge]
    if: always() && needs.prepare.result == 'success' && needs.matrix.result == 'success' && needs.merge.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Finalize and reverify main
        run: |
          set -euo pipefail
          cp .github/finalize_alpha.py /tmp/finalize_alpha.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          python3 /tmp/finalize_alpha.py finalize \
            --root . \
            --pull-request "${{ needs.prepare.outputs.pull_request }}" \
            --source-sha "${{ needs.prepare.outputs.source_sha }}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --server-url "$GITHUB_SERVER_URL"

          rm -rf .github/bootstrap
          rm -f .github/fix_mcp_cancellation.py
          rm -f .github/normalize_review_v4.py
          rm -f .github/workflows/post-release-bootstrap-v3.yml
          rm -f .github/workflows/post-release-bootstrap-v4.yml
          rm -f .github/workflows/bootstrap-status.yml
          rm -f .github/workflows/bootstrap-status-v3.yml

          npm ci
          python3 setup_launchpad.py --check
          python3 execution/verify_setup.py
          node --test tests/mcp-cancellation.test.js
          npm run ci
          npm run smoke:package
          npm run pack:dry
          npm audit --omit=dev
          npm ls --omit=dev

          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): complete public alpha bootstrap" -m "Refs: directives 003-004"
            git push origin main
          fi
          git push origin --delete alpha-release-v4 || true
          git push origin --delete alpha-release-v3 || true
          git push origin --delete launchpad-bootstrap || true
